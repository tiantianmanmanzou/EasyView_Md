<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self'; connect-src http: https:; worker-src 'none';"
    />
    <link href="./webview.css" rel="stylesheet" />
    <link href="./xterm.css" rel="stylesheet" />
    <link href="./desktop.css" rel="stylesheet" />
    <title>EasyView_Md</title>
  </head>
  <body class="inlinemd-booting easyview-desktop">
    <div id="desktop-root">
      <header id="desktop-title-bar">
        <button id="workspace-toggle" class="desktop-title-button" type="button" title="目录树">☰</button>
        <span id="desktop-document-name">Untitled.md</span>
        <button id="outline-toggle" class="desktop-title-button" type="button" title="文档目录">☷</button>
      </header>
      <div id="desktop-workbench">
        <aside id="workspace-explorer" aria-label="工作区目录树"></aside>
        <div id="editor-body">
          <div id="editor-scroll-area">
            <div id="editor"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
