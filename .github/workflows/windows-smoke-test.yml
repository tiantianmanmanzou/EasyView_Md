name: Windows Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/editor-core/**'
      - 'packages/preview-ui/**'
      - 'packages/node-runtime/**'
      - '.github/workflows/windows-smoke-test.yml'
      - '.github/scripts/windows-smoke-launch.ps1'
      - '.github/scripts/resolve-latest-win-zip.ps1'
      - '.github/test-sample.md'

jobs:
  test-source-build:
    name: Source build smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package desktop
        run: npm run package:desktop

      - name: Launch and smoke-test packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem "apps\desktop\out" -Recurse -Filter "EasyView_Md.exe" | Select-Object -First 1
          if (-not $exe) { throw "Packaged EasyView_Md.exe not found under apps/desktop/out" }
          Write-Host "Using $($exe.FullName)"
          $testFile = Join-Path $env:GITHUB_WORKSPACE ".github\test-sample.md"
          .\.github\scripts\windows-smoke-launch.ps1 `
            -ExePath $exe.FullName `
            -TestFile $testFile `
            -LogsDir "logs-source" `
            -WaitSeconds 25 `
            -JobLabel "source-build"

      - name: Upload source smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-source
          path: logs-source/
          retention-days: 14
          if-no-files-found: warn

  test-published-release:
    name: Published release zip smoke
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve latest Windows x64 zip from GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\.github\scripts\resolve-latest-win-zip.ps1

      - name: Download and extract release zip
        shell: pwsh
        run: |
          Write-Host "Downloading $($env:DOWNLOAD_URL) (release $($env:RELEASE_TAG), asset $($env:RELEASE_ASSET))"
          Invoke-WebRequest -Uri $env:DOWNLOAD_URL -OutFile EasyView_Md-win-x64.zip
          Expand-Archive -Path EasyView_Md-win-x64.zip -DestinationPath published -Force
          Get-ChildItem published -Recurse -Depth 2

      - name: Launch and smoke-test published app
        shell: pwsh
        run: |
          $exe = Get-ChildItem "published" -Recurse -Filter "EasyView_Md.exe" | Select-Object -First 1
          if (-not $exe) { throw "EasyView_Md.exe not found inside published release zip" }
          Write-Host "Using $($exe.FullName)"
          $testFile = Join-Path $env:GITHUB_WORKSPACE ".github\test-sample.md"
          .\.github\scripts\windows-smoke-launch.ps1 `
            -ExePath $exe.FullName `
            -TestFile $testFile `
            -LogsDir "logs-published" `
            -WaitSeconds 25 `
            -JobLabel "published-release"

      - name: Upload published smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-published
          path: logs-published/
          retention-days: 14
          if-no-files-found: warn
